<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jupiter</title>
  <meta name="theme-color" content="#F4F3EF" id="metaThemeColor" />
  <style>
    /* ==========================================================================
       DESIGN TOKENS & THEME VARIABLES (Light & Dark Modes)
       ========================================================================== */
    :root[data-theme="light"] {
      --bg-canvas: #F4F3EF;
      --card-surface: #FFFFFF;
      --card-nested: #F7F6F2;
      --card-border: rgba(0, 0, 0, 0.05);
      --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.035);
      --text-primary: #111111;
      --text-secondary: #3A3A3C;
      --text-muted: #8E8E93;
      --dock-surface: rgba(255, 255, 255, 0.88);
      --dock-border: rgba(0, 0, 0, 0.07);
      --dock-active-pill: #EFECE6;
      --dock-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --sheet-bg: #FFFFFF;
      --input-bg: #F4F3EF;
      --accent-blue: #007AFF;
      --accent-green: #28A745;
      --accent-amber: #F59E0B;
      --match-bg: rgba(40, 167, 69, 0.1);
      --match-text: #1E7E34;
    }

    :root[data-theme="dark"] {
      --bg-canvas: #000000;
      --card-surface: #1C1C1E;
      --card-nested: #2C2C2E;
      --card-border: rgba(255, 255, 255, 0.09);
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      --text-primary: #FFFFFF;
      --text-secondary: #D1D1D6;
      --text-muted: #8E8E93;
      --dock-surface: rgba(28, 28, 30, 0.88);
      --dock-border: rgba(255, 255, 255, 0.12);
      --dock-active-pill: #3A3A3C;
      --dock-shadow: 0 12px 36px rgba(0, 0, 0, 0.85);
      --sheet-bg: #1C1C1E;
      --input-bg: #2C2C2E;
      --accent-blue: #5E9EFF;
      --accent-green: #32D74B;
      --accent-amber: #FBBF24;
      --match-bg: rgba(50, 215, 75, 0.14);
      --match-text: #32D74B;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 24px 16px 120px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      width: 100%;
      max-width: 430px;
    }

    /* ==========================================================================
       TOP HEADER (Clean Greeting + Day Pill Only)
       ========================================================================== */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 4px 4px 0 4px;
      gap: 12px;
    }

    .greeting-heading {
      margin: 0;
      font-size: 1.42rem;
      font-weight: 700;
      letter-spacing: -0.45px;
      color: var(--text-primary);
      cursor: pointer;
      line-height: 1.2;
    }

    .day-pill {
      background: var(--card-surface);
      color: var(--text-primary);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s ease, background-color 0.25s ease;
      user-select: none;
    }

    .day-pill:active {
      transform: scale(0.95);
    }

    /* ==========================================================================
       CARDS & SCHEDULE STACK
       ========================================================================== */
    .card-stack {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .avec-card {
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 16px 18px;
      box-shadow: var(--card-shadow);
      transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
    }

    /* Standard Class Card Layout */
    .class-row {
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    /* Single-line Lunch Card Layout */
    .class-row.single-line {
      align-items: center;
    }

    .emoji-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .class-row.single-line .emoji-circle {
      margin-top: 0;
    }

    .class-body {
      flex: 1;
      min-width: 0;
    }

    .class-top-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .class-row.single-line .class-top-line {
      align-items: center;
    }

    .class-name {
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }

    .class-time {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .class-meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 2px;
      line-height: 1.35;
    }

    .class-tasks-preview {
      margin-top: 7px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .class-task-line {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ==========================================================================
       FLOATING MULTI-PART BOTTOM BAR (Matching Avec Mockups)
       ========================================================================== */
    .bottom-dock-wrapper {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 406px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 100;
      pointer-events: none;
    }

    /* Left Group Pill: Schedule, Tasks, Menu Bar */
    .dock-pill-group {
      pointer-events: auto;
      display: flex;
      align-items: center;
      background: var(--dock-surface);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid var(--dock-border);
      box-shadow: var(--dock-shadow);
      border-radius: 999px;
      padding: 5px 6px;
      gap: 4px;
      flex: 1;
      justify-content: space-around;
    }

    .dock-group-btn {
      position: relative;
      border: none;
      background: transparent;
      color: var(--text-muted);
      width: 46px;
      height: 42px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.12s ease;
    }

    .dock-group-btn.active {
      background: var(--dock-active-pill);
      color: var(--text-primary);
    }

    .dock-group-btn:active {
      transform: scale(0.92);
    }

    /* Amber notification dot on Tasks icon */
    .task-notif-dot {
      position: absolute;
      top: 9px;
      right: 11px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-amber);
      border: 1.5px solid var(--card-surface);
    }

    /* Right Standalone Circular Floating Buttons */
    .dock-circle-btn {
      pointer-events: auto;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--dock-border);
      background: var(--dock-surface);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      box-shadow: var(--dock-shadow);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s ease, transform 0.12s ease;
    }

    .dock-circle-btn.active {
      background: var(--dock-active-pill);
    }

    .dock-circle-btn:active {
      transform: scale(0.92);
    }

    .profile-avatar-ring {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #EC4899 100%);
      color: #FFFFFF;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
    }

    /* ==========================================================================
       TASKS, SEARCH & SECONDARY VIEWS
       ========================================================================== */
    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
    }

    .filter-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }

    .chip-btn {
      background: var(--card-surface);
      color: var(--text-secondary);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip-btn.active {
      background: var(--text-primary);
      color: var(--bg-canvas);
      border-color: var(--text-primary);
    }

    .task-item-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .task-check-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      color: transparent;
      transition: all 0.15s ease;
    }

    .task-check-circle.checked {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #FFFFFF;
    }

    .task-item-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .task-item-text.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-item-tag {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--accent-blue);
      margin-top: 2px;
    }

    .delete-icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
    }

    /* Day Browser Strip in Search View */
    .day-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .day-strip-item {
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .day-strip-item.active {
      background: var(--text-primary);
      color: var(--bg-canvas);
      border-color: var(--text-primary);
    }

    .day-strip-name {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .day-strip-num {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .day-strip-badge {
      font-size: 0.65rem;
      font-weight: 600;
      margin-top: 2px;
      opacity: 0.85;
    }

    /* ==========================================================================
       BOTTOM SHEETS & MODALS
       ========================================================================== */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .bottom-sheet {
      position: fixed;
      left: 50%;
      bottom: -100%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      background: var(--sheet-bg);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border-top: 1px solid var(--card-border);
      padding: 14px 20px 36px 20px;
      z-index: 201;
      max-height: 86vh;
      overflow-y: auto;
      transition: bottom 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
    }

    .bottom-sheet.open {
      bottom: 0;
    }

    .sheet-grabber {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--text-muted);
      opacity: 0.35;
      margin: 0 auto 14px auto;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .sheet-title {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .sheet-close {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: var(--card-nested);
      color: var(--text-primary);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Form Controls inside Sheets */
    .form-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 13px 15px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.96rem;
      font-family: inherit;
      outline: none;
      margin-bottom: 14px;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
    }

    .primary-action-btn {
      width: 100%;
      padding: 14px;
      border-radius: 15px;
      border: none;
      background: var(--text-primary);
      color: var(--bg-canvas);
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    .primary-action-btn:active {
      transform: scale(0.98);
    }

    .menu-row-btn {
      width: 100%;
      background: var(--card-nested);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .profile-pill-btn {
      background: var(--card-nested);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .profile-pill-btn.active {
      background: var(--text-primary);
      color: var(--bg-canvas);
      border-color: var(--text-primary);
    }

    .segmented-bar {
      display: flex;
      background: var(--card-nested);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
      gap: 4px;
    }

    .segment-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 9px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .segment-btn.active {
      background: var(--card-surface);
      color: var(--text-primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- Clean Top Header (Greeting + Day Pill Only) -->
  <header class="top-header">
    <h1 class="greeting-heading" id="greetingHeading" onclick="openProfileSheet()">Good morning, Christos.</h1>
    <button class="day-pill" id="dayPillBtn" onclick="toggleDay()">Day 1</button>
  </header>

  <!-- Main Content Area -->
  <main id="mainContent"></main>
</div>

<!-- Exact Multi-Part Floating Bottom Dock -->
<nav class="bottom-dock-wrapper" aria-label="Primary Navigation">
  <!-- Left Pill Group (Schedule, Tasks, Menu Bar) -->
  <div class="dock-pill-group">
    <button class="dock-group-btn active" id="navSchedule" onclick="switchView('schedule')" title="Schedule">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
        <rect x="4" y="4" width="16" height="4" rx="1.5"></rect>
        <rect x="4" y="10" width="16" height="4" rx="1.5"></rect>
        <rect x="4" y="16" width="16" height="4" rx="1.5"></rect>
      </svg>
    </button>

    <button class="dock-group-btn" id="navTasks" onclick="switchView('tasks')" title="Tasks">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <polyline points="12 7 12 12 15 14"></polyline>
      </svg>
      <span class="task-notif-dot" id="taskNotifDot"></span>
    </button>

    <button class="dock-group-btn" id="navMenu" onclick="openMenuSheet()" title="Menu Bar">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="7 9 12 4 17 9"></polyline>
        <polyline points="7 15 12 20 17 15"></polyline>
      </svg>
    </button>
  </div>

  <!-- Standalone Circular Button 1: New Task / Event -->
  <button class="dock-circle-btn" id="navNew" onclick="openNewSheet('task')" title="New Task or Event">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
    </svg>
  </button>

  <!-- Standalone Circular Button 2: Search & Other Days -->
  <button class="dock-circle-btn" id="navSearch" onclick="switchView('search')" title="Search & Calendar Days">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7.5"></circle>
      <line x1="20.5" y1="20.5" x2="16.35" y2="16.35"></line>
    </svg>
  </button>

  <!-- Standalone Circular Button 3: Profile & Compare -->
  <button class="dock-circle-btn" id="navProfile" onclick="openProfileSheet()" title="Profile & Compare">
    <div class="profile-avatar-ring" id="dockProfileInitials">CH</div>
  </button>
</nav>

<!-- Bottom Sheet Backdrop & Container -->
<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="bottomSheet" onclick="event.stopPropagation()"></div>

<script>
  /* ==========================================================================
     SAFE STORAGE HELPER
     ========================================================================== */
  const safeStorage = {
    get(key, fallback) {
      try {
        const val = localStorage.getItem(key);
        return val !== null ? val : fallback;
      } catch (e) {
        return fallback;
      }
    },
    set(key, val) {
      try {
        localStorage.setItem(key, val);
      } catch (e) {
        // Ignore storage errors in restricted environments
      }
    }
  };

  /* ==========================================================================
     MASTER SCHEDULES & SUBJECT METADATA
     ========================================================================== */
  const masterSchedules = {

  function parseTimeToMinutes(timeStr) {
    if (!timeStr) return 900;
    const match = timeStr.trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
    if (!match) return 900;
    let hrs = parseInt(match[1], 10);
    const mins = parseInt(match[2], 10);
    const period = (match[3] || "").toUpperCase();
    if (period === "PM" && hrs !== 12) hrs += 12;
    if (period === "AM" && hrs === 12) hrs = 0;
    return hrs * 60 + mins;
  }

    document.getElementById("dockProfileInitials").textContent = student.name.slice(0, 2).toUpperCase();

    // Update Dock Active Indicators
    document.getElementById("navSchedule").classList.toggle("active", state.currentView === "schedule");
    document.getElementById("navTasks").classList.toggle("active", state.currentView === "tasks");
    document.getElementById("navSearch").classList.toggle("active", state.currentView === "search");

    // Update Tasks notification dot visibility
    const hasOpenTasks = state.tasks.some(t => !t.completed);
    document.getElementById("taskNotifDot").style.display = hasOpenTasks ? "block" : "none";
  }

  /* ==========================================================================

    if (state.currentView === "schedule") {
      main.innerHTML = renderScheduleHTML(state.currentDay);
    } else if (state.currentView === "tasks") {
      main.innerHTML = renderTasksHTML();
    } else if (state.currentView === "search") {
      main.innerHTML = renderSearchHTML();
      runSearchFilter();
    }

  function renderScheduleHTML(dayNum) {
    const student = masterSchedules[state.activeUser] || masterSchedules.christos;
    const order = dayNum === 1 ? [0, 1, 2, 3] : [1, 0, 3, 2];
    const bellSchedule = state.isAssembly ? assemblyBellTimes : regularBellTimes;

    // Build unified chronological items list (classes + lunch + custom events)
    const items = [];

    bellSchedule.forEach(slot => {
      if (slot.type === "lunch") {
        const meta = subjectMeta["Lunch"];
        items.push({
          sortMinutes: slot.sortMinutes,
          html: `
            <div class="avec-card">
              <div class="class-row single-line">
                <div class="emoji-circle" style="background-color: ${meta.bg};">${meta.emoji}</div>
                <div class="class-body">
                  <div class="class-top-line">
                    <span class="class-name">Lunch</span>
                    <span class="class-time">${slot.time}</span>
                  </div>
                </div>
              </div>
            </div>
          `
        });
      } else if (slot.type === "assembly") {
        items.push({
          sortMinutes: slot.sortMinutes,
          html: `
            <div class="avec-card">
              <div class="class-row">
                <div class="emoji-circle" style="background-color: #FCA5A5;">📢</div>
                <div class="class-body">
                  <div class="class-top-line">
                    <span class="class-name">School Assembly</span>
                    <span class="class-time">${slot.time}</span>
                  </div>
                  <div class="class-meta">Main Auditorium | All Grades</div>
                </div>
              </div>
            </div>
          `
        });
      } else {
        const actualPeriodIndex = order[slot.periodIdx];
        const course = student.baseSchedule[actualPeriodIndex][state.activeSemester];
        const meta = subjectMeta[course.title] || { emoji: "📖", bg: "#E5E7EB" };
        const activeClassTasks = state.tasks.filter(
          t => !t.completed && t.classKey.toLowerCase() === course.title.toLowerCase()
        );

        const taskLinesHTML = activeClassTasks.length > 0
          ? `<div class="class-tasks-preview">
              ${activeClassTasks.map(t => `<div class="class-task-line">${escapeHTML(t.title)}</div>`).join("")}
            </div>`
          : "";

        items.push({
          sortMinutes: slot.sortMinutes,
          html: `
            <div class="avec-card">
              <div class="class-row">
                <div class="emoji-circle" style="background-color: ${meta.bg};">${meta.emoji}</div>
                <div class="class-body">
                  <div class="class-top-line">
                    <span class="class-name">${escapeHTML(course.title)}</span>
                    <span class="class-time">${slot.time}</span>
                  </div>
                  <div class="class-meta">${escapeHTML(course.teacher)} | Room ${escapeHTML(course.room)}</div>
                  ${taskLinesHTML}
                </div>
              </div>
            </div>
          `
        });
      }
    });

    // Inject custom events scheduled for this day
    state.customEvents
      .filter(ev => ev.day === "all" || Number(ev.day) === dayNum)
      .forEach(ev => {
        items.push({
          sortMinutes: parseTimeToMinutes(ev.time),
          html: `
            <div class="avec-card">
              <div class="class-row">
                <div class="emoji-circle" style="background-color: #BAE6FD;">${ev.emoji || "📅"}</div>
                <div class="class-body">
                  <div class="class-top-line">
                    <span class="class-name">${escapeHTML(ev.title)}</span>
                    <span class="class-time">${escapeHTML(ev.time)}</span>
                  </div>
                  <div class="class-meta">${escapeHTML(ev.location || "Calendar Event")}</div>
                </div>
              </div>
            </div>
          `
        });
      });

    items.sort((a, b) => a.sortMinutes - b.sortMinutes);

    return `<div class="card-stack">${items.map(i => i.html).join("")}</div>`;
  }

  function renderSearchHTML() {
    const dayNames = ["Mon", "Tue", "Wed", "Thu", "Fri"];
    const baseDate = new Date();
    let stripHTML = `<div class="day-strip">`;

    for (let offset = 0; offset < 5; offset++) {
      const d = new Date(baseDate);
      d.setDate(baseDate.getDate() + offset);
      const label = offset === 0 ? "Today" : dayNames[d.getDay() % 5];
      const dayCycle = ((state.currentDay - 1 + offset) % 2) + 1;
      const isSelected = state.searchDayOffset === offset;

      stripHTML += `
        <div class="day-strip-item ${isSelected ? "active" : ""}" onclick="selectSearchDay(${offset})">
          <div class="day-strip-name">${label}</div>
          <div class="day-strip-num">${d.getDate()}</div>
          <div class="day-strip-badge">Day ${dayCycle}</div>
        </div>
      `;
    }
    stripHTML += `</div>`;

    return `
      <div class="avec-card" style="margin-bottom: 14px; padding: 14px 16px;">
        <label class="form-label" for="searchField">Search Tasks, Classes & Events</label>
        <input type="text" id="searchField" class="form-control" style="margin-bottom: 0;" placeholder="Search by class, teacher, room, or task..." oninput="runSearchFilter()" />
      </div>
      ${stripHTML}
      <div id="searchResultsContainer"></div>
    `;
  }

  function selectSearchDay(offset) {
    state.searchDayOffset = offset;
    render();
  }

  function runSearchFilter() {
    const input = document.getElementById("searchField");
    const container = document.getElementById("searchResultsContainer");
    if (!container) return;

    const query = (input ? input.value : "").trim().toLowerCase();
    const previewDay = ((state.currentDay - 1 + state.searchDayOffset) % 2) + 1;

    if (!query) {
      container.innerHTML = `
        <div class="section-header-row">
          <h3 class="section-title" style="font-size: 0.95rem; color: var(--text-muted);">
            Previewing Day ${previewDay} Schedule
          </h3>
        </div>
        ${renderScheduleHTML(previewDay)}
      `;
      return;
    }

    const student = masterSchedules[state.activeUser] || masterSchedules.christos;
    const matches = [];

    state.tasks.forEach(t => {
      if (t.title.toLowerCase().includes(query) || t.classKey.toLowerCase().includes(query)) {
        matches.push({
          badge: `Task • ${t.classKey}`,
          title: t.title,
          sub: t.completed ? "Completed" : "Active Task"
        });
      }
    });

    student.baseSchedule.forEach((period, idx) => {
      ["s1", "s2"].forEach(sem => {
        const c = period[sem];
        if (
          c.title.toLowerCase().includes(query) ||
          c.teacher.toLowerCase().includes(query) ||
          c.room.toLowerCase().includes(query)
        ) {
          matches.push({
            badge: `Period ${idx + 1} • Sem ${sem.toUpperCase()}`,
            title: c.title,
            sub: `${c.teacher} | Room ${c.room}`
          });
        }
      });
    });

    state.customEvents.forEach(ev => {
      if (ev.title.toLowerCase().includes(query) || (ev.location || "").toLowerCase().includes(query)) {
        matches.push({
          badge: `Event • ${ev.time}`,
          title: ev.title,
          sub: ev.location || "Custom Event"
        });
      }
    });

    if (matches.length === 0) {
      container.innerHTML = `
        <div class="avec-card" style="text-align: center; padding: 28px; color: var(--text-muted);">
          No matching tasks, classes, or events found.
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <div class="card-stack">
        ${matches.map(m => `
          <div class="avec-card">
            <div class="task-item-tag" style="margin-top: 0; margin-bottom: 3px;">${escapeHTML(m.badge)}</div>
            <div class="class-name">${escapeHTML(m.title)}</div>
            <div class="class-meta" style="margin-top: 3px;">${escapeHTML(m.sub)}</div>
          </div>
        `).join("")}
      </div>
    `;
  }

    backdrop.classList.add("open");
    sheet.classList.add("open");
  }

  function closeSheet() {
    document.getElementById("sheetBackdrop").classList.remove("open");
    document.getElementById("bottomSheet").classList.remove("open");
  }

  function openMenuSheet() {
    const student = masterSchedules[state.activeUser] || masterSchedules.christos;
    openSheet(`
      <div class="sheet-header">
        <h3 class="sheet-title">Menu Bar</h3>
        <button class="sheet-close" onclick="closeSheet()">×</button>
      </div>

      <button class="menu-row-btn" onclick="toggleTheme(); openMenuSheet();">
        <span>Appearance</span>
        <span style="color: var(--accent-blue);">${state.theme === "dark" ? "Dark Mode" : "Light Mode"}</span>
      </button>

      <button class="menu-row-btn" onclick="toggleSemester(); openMenuSheet();">
        <span>Semester</span>
        <span style="color: var(--accent-blue);">Semester ${state.activeSemester === "s1" ? "1" : "2"}</span>
      </button>

      <button class="menu-row-btn" onclick="toggleDay(); openMenuSheet();">
        <span>Schedule Cycle</span>
        <span style="color: var(--accent-blue);">Day ${state.currentDay}</span>
      </button>

      <button class="menu-row-btn" onclick="toggleAssembly(); openMenuSheet();">
        <span>Assembly Bell Schedule</span>
        <span style="color: ${state.isAssembly ? "var(--accent-green)" : "var(--text-muted)"};">${state.isAssembly ? "On" : "Off"}</span>
      </button>

      <button class="menu-row-btn" onclick="openCompareSheet()">
        <span>Compare Schedules</span>
        <span style="color: var(--text-muted);">›</span>
      </button>

      <button class="menu-row-btn" onclick="openProfileSheet()">
        <span>Switch Profile (${escapeHTML(student.name)})</span>
        <span style="color: var(--text-muted);">›</span>
      </button>
    `);
  }

  function toggleSemester() {
    state.activeSemester = state.activeSemester === "s1" ? "s2" : "s1";
    persistState();
    render();
  }

  function toggleAssembly() {
    state.isAssembly = !state.isAssembly;
    persistState();
    render();
  }

  function openNewSheet(mode = "task") {
    const student = masterSchedules[state.activeUser] || masterSchedules.christos;
    const classOptions = student.baseSchedule
      .map(p => p[state.activeSemester].title)
      .concat(["General"])
      .filter((v, idx, arr) => arr.indexOf(v) === idx)
      .map(subj => `<option value="${escapeHTML(subj)}">${escapeHTML(subj)}</option>`)
      .join("");

    const bodyHTML = mode === "task"
      ? `
        <label class="form-label" for="taskSubjectSelect">Class</label>
        <select id="taskSubjectSelect" class="form-control">${classOptions}</select>

        <label class="form-label" for="taskTitleInput">Task Details</label>
        <input type="text" id="taskTitleInput" class="form-control" placeholder="e.g., Periodic Table test on April 1st." />

        <button class="primary-action-btn" onclick="submitNewTask()">Save Task</button>
      `
      : `
        <label class="form-label" for="eventTitleInput">Event Title</label>
        <input type="text" id="eventTitleInput" class="form-control" placeholder="e.g., Robotics Club" />

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div>
            <label class="form-label" for="eventTimeInput">Time</label>
            <input type="text" id="eventTimeInput" class="form-control" value="3:15 PM" placeholder="3:15 PM" />
          </div>
          <div>
            <label class="form-label" for="eventDaySelect">Schedule Day</label>
            <select id="eventDaySelect" class="form-control">
              <option value="1">Day 1</option>
              <option value="2">Day 2</option>
              <option value="all">Every Day</option>
            </select>
          </div>
        </div>

        <label class="form-label" for="eventLocationInput">Room / Location</label>
        <input type="text" id="eventLocationInput" class="form-control" placeholder="e.g., Room 119" />

        <button class="primary-action-btn" onclick="submitNewEvent()">Add to Schedule</button>
      `;

    openSheet(`
      <div class="sheet-header">
        <h3 class="sheet-title">${mode === "task" ? "New Task" : "New Calendar Event"}</h3>
        <button class="sheet-close" onclick="closeSheet()">×</button>
      </div>
      <div class="segmented-bar">
        <button class="segment-btn ${mode === "task" ? "active" : ""}" onclick="openNewSheet('task')">Task</button>
        <button class="segment-btn ${mode === "event" ? "active" : ""}" onclick="openNewSheet('event')">Calendar Event</button>
      </div>
      ${bodyHTML}
    `);
  }

  function submitNewTask() {
    const classKey = document.getElementById("taskSubjectSelect").value;
    const title = document.getElementById("taskTitleInput").value.trim();
    if (!title) return;

    state.tasks.unshift({
      id: Date.now(),
      classKey,
      title,
      completed: false
    });
    persistState();
    closeSheet();
    render();
  }

  function submitNewEvent() {
    const title = document.getElementById("eventTitleInput").value.trim();
    const time = document.getElementById("eventTimeInput").value.trim() || "3:15 PM";
    const dayVal = document.getElementById("eventDaySelect").value;
    const location = document.getElementById("eventLocationInput").value.trim();
    if (!title) return;

    state.customEvents.push({
      id: Date.now(),
      title,
      time,
      location,
      day: dayVal === "all" ? "all" : Number(dayVal),
      emoji: "📅"
    });
    persistState();
    closeSheet();
    switchView("schedule");
  }

  function openProfileSheet() {
    const pillsHTML = Object.keys(masterSchedules).map(key => `
      <button class="profile-pill-btn ${state.activeUser === key ? "active" : ""}" onclick="selectProfile('${key}')">
        ${escapeHTML(masterSchedules[key].name)}
      </button>
    `).join("");

    openSheet(`
      <div class="sheet-header">
        <h3 class="sheet-title">Profile & Settings</h3>
        <button class="sheet-close" onclick="closeSheet()">×</button>
      </div>

      <label class="form-label">Active Student Profile</label>
      <div class="profile-grid">${pillsHTML}</div>

      <button class="menu-row-btn" onclick="toggleTheme(); openProfileSheet();">
        <span>Theme</span>
        <span style="color: var(--accent-blue);">${state.theme === "dark" ? "Dark" : "Light"}</span>
      </button>

      <button class="primary-action-btn" style="margin-top: 6px;" onclick="openCompareSheet()">
        Compare Schedules with Friends
      </button>
    `);
  }

  function selectProfile(key) {
    state.activeUser = key;
    persistState();
    closeSheet();
    render();
  }

  function openCompareSheet() {
    const friendPills = Object.keys(masterSchedules).map(key => {
      const selected = state.selectedFriends.includes(key);
      return `
        <button class="profile-pill-btn ${selected ? "active" : ""}" onclick="toggleCompareFriend('${key}')">
          ${escapeHTML(masterSchedules[key].name)}
        </button>
      `;
    }).join("");

    let periodsHTML = "";
    for (let p = 0; p < 4; p++) {
      const subjectCounts = {};
      state.selectedFriends.forEach(k => {
        const s = masterSchedules[k];
        if (s) {
          const title = s.baseSchedule[p][state.compareSemester].title;
          subjectCounts[title] = (subjectCounts[title] || 0) + 1;
        }
      });

      const hasMatch = Object.values(subjectCounts).some(count => count > 1);
      const rows = state.selectedFriends.map(k => {
        const s = masterSchedules[k];
        if (!s) return "";
        const course = s.baseSchedule[p][state.compareSemester];
        const isMatch = subjectCounts[course.title] > 1;
        return `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 10px; background: ${isMatch ? "var(--match-bg)" : "transparent"}; font-size: 0.86rem;">
            <span style="font-weight: 600; width: 88px;">${escapeHTML(s.name)}</span>
            <span style="flex: 1; text-align: center; font-weight: ${isMatch ? "700" : "500"}; color: ${isMatch ? "var(--match-text)" : "var(--text-primary)"};">${escapeHTML(course.title)}</span>
            <span style="color: var(--text-muted); font-size: 0.78rem;">Rm ${escapeHTML(course.room)}</span>
          </div>
        `;
      }).join("");

      periodsHTML += `
        <div class="avec-card" style="padding: 14px 16px; margin-bottom: 10px; background: var(--card-nested);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted);">
            <span>Period ${p + 1}</span>
            ${hasMatch ? `<span style="color: var(--accent-green);">Shared Class</span>` : ""}
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px;">${rows}</div>
        </div>
      `;
    }

    openSheet(`
      <div class="sheet-header">
        <h3 class="sheet-title">Compare Schedules</h3>
        <button class="sheet-close" onclick="closeSheet()">×</button>
      </div>

      <div class="segmented-bar">
        <button class="segment-btn ${state.compareSemester === "s1" ? "active" : ""}" onclick="state.compareSemester='s1'; openCompareSheet();">Semester 1</button>
        <button class="segment-btn ${state.compareSemester === "s2" ? "active" : ""}" onclick="state.compareSemester='s2'; openCompareSheet();">Semester 2</button>
      </div>

      <label class="form-label">Select Students</label>
      <div class="profile-grid">${friendPills}</div>
      ${periodsHTML}
    `);
  }

  function toggleCompareFriend(key) {
    if (state.selectedFriends.includes(key)) {
      if (state.selectedFriends.length > 1) {
        state.selectedFriends = state.selectedFriends.filter(k => k !== key);
      }
    } else {
      state.selectedFriends.push(key);
    }
    openCompareSheet();
  }

  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Initialize on load
  applyTheme(state.theme);
  render();
</script>
</body>
</html>
