<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jupiter</title>
  <meta name="theme-color" content="#F4F3EF" id="metaThemeColor" />
  <style>
    /* ==========================================================================
       DESIGN TOKENS & THEME VARIABLES (Light & Dark Modes)
       ========================================================================== */
    :root[data-theme="light"] {
      --bg-canvas: #F4F3EF;
      --card-surface: #FFFFFF;
      --card-nested: #F7F6F2;
      --card-border: rgba(0, 0, 0, 0.06);
      --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.035);
      --text-primary: #111111;
      --text-secondary: #3A3A3C;
      --text-muted: #8E8E93;
      --dock-surface: rgba(255, 255, 255, 0.90);
      --dock-border: rgba(0, 0, 0, 0.08);
      --dock-active-pill: #EFECE6;
      --dock-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --sheet-bg: #FFFFFF;
      --input-bg: #F4F3EF;
      --accent-blue: #007AFF;
      --accent-green: #28A745;
      --accent-amber: #F59E0B;
      --accent-red: #FF3B30;
      --match-bg: rgba(40, 167, 69, 0.12);
      --match-text: #1E7E34;
    }

    :root[data-theme="dark"] {
      --bg-canvas: #000000;
      --card-surface: #1C1C1E;
      --card-nested: #2C2C2E;
      --card-border: rgba(255, 255, 255, 0.10);
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      --text-primary: #FFFFFF;
      --text-secondary: #D1D1D6;
      --text-muted: #8E8E93;
      --dock-surface: rgba(28, 28, 30, 0.90);
      --dock-border: rgba(255, 255, 255, 0.13);
      --dock-active-pill: #3A3A3C;
      --dock-shadow: 0 12px 36px rgba(0, 0, 0, 0.85);
      --sheet-bg: #1C1C1E;
      --input-bg: #2C2C2E;
      --accent-blue: #5E9EFF;
      --accent-green: #32D74B;
      --accent-amber: #FBBF24;
      --accent-red: #FF453A;
      --match-bg: rgba(50, 215, 75, 0.16);
      --match-text: #32D74B;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 24px 16px 124px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      width: 100%;
      max-width: 430px;
    }

    /* ==========================================================================
       TOP HEADER (Clean Greeting + Day Pill Only)
       ========================================================================== */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 4px 4px 0 4px;
      gap: 12px;
    }

    .greeting-heading {
      margin: 0;
      font-size: 1.42rem;
      font-weight: 700;
      letter-spacing: -0.45px;
      color: var(--text-primary);
      cursor: pointer;
      line-height: 1.2;
    }

    .day-pill {
      background: var(--card-surface);
      color: var(--text-primary);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s ease, background-color 0.25s ease;
      user-select: none;
    }

    .day-pill:active {
      transform: scale(0.95);
    }

    /* ==========================================================================
       CARDS & SCHEDULE STACK
       ========================================================================== */
    .card-stack {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .avec-card {
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 16px 18px;
      box-shadow: var(--card-shadow);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .class-row {
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .class-row.single-line {
      align-items: center;
    }

    .emoji-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .class-row.single-line .emoji-circle {
      margin-top: 0;
    }

    .class-body {
      flex: 1;
      min-width: 0;
    }

    .class-top-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .class-row.single-line .class-top-line {
      align-items: center;
    }

    .class-name {
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }

    .class-time {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .class-meta {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 2px;
      line-height: 1.35;
    }

    .class-tasks-preview {
      margin-top: 7px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .class-task-line {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ==========================================================================
       FLOATING MULTI-PART BOTTOM DOCK (Matching Avec Mockup)
       ========================================================================== */
    .bottom-dock-wrapper {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 406px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 100;
      pointer-events: none;
    }

    .dock-pill-group {
      pointer-events: auto;
      display: flex;
      align-items: center;
      background: var(--dock-surface);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      border: 1px solid var(--dock-border);
      box-shadow: var(--dock-shadow);
      border-radius: 999px;
      padding: 5px 6px;
      gap: 4px;
      flex: 1;
      justify-content: space-around;
    }

    .dock-group-btn {
      position: relative;
      border: none;
      background: transparent;
      color: var(--text-muted);
      width: 46px;
      height: 42px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.12s ease;
    }

    .dock-group-btn.active {
      background: var(--dock-active-pill);
      color: var(--text-primary);
    }

    .dock-group-btn:active {
      transform: scale(0.92);
    }

    .task-notif-dot {
      position: absolute;
      top: 9px;
      right: 11px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent-amber);
      border: 1.5px solid var(--card-surface);
      display: none;
    }

    .task-notif-dot.visible {
      display: block;
    }

    .dock-circle-btn {
      pointer-events: auto;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--dock-border);
      background: var(--dock-surface);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      box-shadow: var(--dock-shadow);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s ease, transform 0.12s ease;
    }

    .dock-circle-btn.active {
      background: var(--dock-active-pill);
    }

    .dock-circle-btn:active {
      transform: scale(0.92);
    }

    .profile-avatar-ring {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #EC4899 100%);
      color: #FFFFFF;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
    }

    /* ==========================================================================
       TASKS, SEARCH & SECONDARY VIEWS
       ========================================================================== */
    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0;
    }

    .filter-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }

    .chip-btn {
      background: var(--card-surface);
      color: var(--text-secondary);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip-btn.active {
      background: var(--text-primary);
      color: var(--bg-canvas);
      border-color: var(--text-primary);
    }

    .task-item-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .task-check-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      color: transparent;
      transition: all 0.15s ease;
    }

    .task-check-circle.checked {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #FFFFFF;
    }

    .task-item-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .task-item-text.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-item-tag {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--accent-blue);
      margin-top: 2px;
    }

    .delete-icon-btn {
      background: var(--card-nested);
      border: none;
      color: var(--text-muted);
      font-size: 1.05rem;
      cursor: pointer;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .delete-icon-btn:hover {
      color: var(--accent-red);
    }

    /* Day Browser Strip in Search View (7 Days Horizontal Scroll) */
    .day-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .day-strip::-webkit-scrollbar { display: none; }

    .day-strip-item {
      flex: 0 0 68px;
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .day-strip-item.active {
      background: var(--text-primary);
      color: var(--bg-canvas);
      border-color: var(--text-primary);
    }

    .day-strip-name {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .day-strip-num {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .day-strip-badge {
      font-size: 0.65rem;
      font-weight: 600;
      margin-top: 2px;
      opacity: 0.85;
    }

    /* ==========================================================================
       BOTTOM SHEETS & MODALS
       ========================================================================== */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .bottom-sheet {
      position: fixed;
      left: 50%;
      bottom: -100%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      background: var(--sheet-bg);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border-top: 1px solid var(--card-border);
      padding: 14px 20px 36px 20px;
      z-index: 201;
      max-height: 88vh;
      overflow-y: auto;
      transition: bottom 0.32s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
    }

    .bottom-sheet.open {
      bottom: 0;
    }

    .sheet-grabber {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--text-muted);
      opacity: 0.35;
      margin: 0 auto 14px auto;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .sheet-title {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .sheet-close {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: var(--card-nested);
      color: var(--text-primary);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .form-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 13px 15px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.96rem;
      font-family: inherit;
      outline: none;
      margin-bottom: 14px;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
    }

    .primary-action-btn {
      width: 100%;
      padding: 14px;
      border-radius: 15px;
      border: none;
      background: var(--text-primary);
      color: var(--bg-canvas);
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    .primary-action-btn:active {
      transform: scale(0.98);
    }

    .menu-row-btn {
      width: 100%;
      background: var(--card-nested);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .profile-pill-btn {
      background: var(--card-nested);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .profile-pill-btn.active {
      background: var(--text-primary);
      color: var(--bg-canvas);
      border-color: var(--text-primary);
    }

    .segmented-bar {
      display: flex;
      background: var(--card-nested);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
      gap: 4px;
    }

    .segment-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 9px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .segment-btn.active {
      background: var(--card-surface);
      color: var(--text-primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- Clean Top Header (Greeting + Day Pill Only) -->
  <header class="top-header">
    <h1 class="greeting-heading" id="greetingHeading" onclick="window.openProfileSheet()">Good morning, Christos.</h1>
    <button type="button" class="day-pill" id="dayPillBtn" onclick="window.toggleDay()">Day 1</button>
  </header>

  <!-- Main Content Area -->
  <main id="mainContent"></main>
</div>

<!-- Multi-Part Floating Bottom Dock -->
<nav class="bottom-dock-wrapper" aria-label="Primary Navigation">
  <!-- Left Pill Group (Schedule, Tasks, Menu Bar) -->
  <div class="dock-pill-group">
    <button type="button" class="dock-group-btn active" id="navSchedule" onclick="window.switchView('schedule')" title="Schedule">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
        <rect x="4" y="4" width="16" height="4" rx="1.5"></rect>
        <rect x="4" y="10" width="16" height="4" rx="1.5"></rect>
        <rect x="4" y="16" width="16" height="4" rx="1.5"></rect>
      </svg>
    </button>

    <button type="button" class="dock-group-btn" id="navTasks" onclick="window.switchView('tasks')" title="Tasks">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <polyline points="12 7 12 12 15 14"></polyline>
      </svg>
      <span class="task-notif-dot" id="taskNotifDot"></span>
    </button>

    <button type="button" class="dock-group-btn" id="navMenu" onclick="window.openMenuSheet()" title="Menu Bar">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="7 9 12 4 17 9"></polyline>
        <polyline points="7 15 12 20 17 15"></polyline>
      </svg>
    </button>
  </div>

  <!-- Standalone Circular Button 1: New Task / Event -->
  <button type="button" class="dock-circle-btn" id="navNew" onclick="window.openNewSheet('task')" title="New Task or Event">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
    </svg>
  </button>

  <!-- Standalone Circular Button 2: Search & Other Days -->
  <button type="button" class="dock-circle-btn" id="navSearch" onclick="window.switchView('search')" title="Search & Calendar Days">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7.5"></circle>
      <line x1="20.5" y1="20.5" x2="16.35" y2="16.35"></line>
    </svg>
  </button>

  <!-- Standalone Circular Button 3: Profile & Compare -->
  <button type="button" class="dock-circle-btn" id="navProfile" onclick="window.openProfileSheet()" title="Profile & Compare">
    <div class="profile-avatar-ring" id="dockProfileInitials">CH</div>
  </button>
</nav>

<!-- Bottom Sheet Backdrop & Container -->
<div class="sheet-backdrop" id="sheetBackdrop" onclick="window.closeSheet()"></div>
<div class="bottom-sheet" id="bottomSheet" onclick="event.stopPropagation()"></div>

<script>
  (function () {
    /* ==========================================================================
       BULLETPROOF STORAGE HELPER (With In-Memory Fallback for Sandboxed Iframes)
       ========================================================================== */
    const memoryStore = {};
    const safeStorage = {
      get(key, fallback) {
        try {
          const val = window.localStorage.getItem(key);
          if (val !== null) return val;
        } catch (e) {
          // localStorage blocked by sandbox; fall back to memoryStore
        }
        return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : fallback;
      },
      set(key, val) {
        memoryStore[key] = val;
        try {
          window.localStorage.setItem(key, val);
        } catch (e) {
          // localStorage blocked by sandbox; safely stored in memoryStore
        }
      }
    };

    /* ==========================================================================
       MASTER SCHEDULES & SUBJECT METADATA
       ========================================================================== */

    /* ==========================================================================
       DATE & TIME UTILITIES
       ========================================================================== */
    function getLocalDateISO(dateObj = new Date()) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, "0");
      const day = String(dateObj.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatFriendlyDate(isoStr) {
      if (!isoStr) return "";
      const parts = isoStr.split("-");
      if (parts.length !== 3) return isoStr;
      const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    }

    function parseTimeToMinutes(timeStr) {
      if (!timeStr) return 900;
      const clean = String(timeStr).trim().toUpperCase();
      const match = clean.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/);
      if (!match) return 900;
      let hours = parseInt(match[1], 10);
      const mins = parseInt(match[2], 10);
      const meridiem = match[3];
      if (meridiem === "PM" && hours < 12) hours += 12;
      if (meridiem === "AM" && hours === 12) hours = 0;
      return hours * 60 + mins;
    }

    function format24To12(time24) {
      if (!time24) return "3:15 PM";
      if (time24.toUpperCase().includes("AM") || time24.toUpperCase().includes("PM")) {
        return time24;
      }
      const parts = time24.split(":");
      if (parts.length < 2) return time24;
      let h = parseInt(parts[0], 10);
      const m = parts[1];
      const suffix = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
      return `${h}:${m} ${suffix}`;
    }

    function escapeHTML(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /* ==========================================================================
       SCHEDULE RENDERER
       ========================================================================== */
    function getEventScheduleLabel(ev) {
      const todayISO = getLocalDateISO(new Date());
      if (ev.repeatType === "date" && ev.date) {
        return ev.date === todayISO ? "Today Only" : formatFriendlyDate(ev.date);
      }
      if (ev.day === "all") return "Every Day";
      return `Day ${ev.day}`;
    }

    function renderScheduleHTML(dayNum, targetDateISO = state.viewingDateISO) {
      const student = masterSchedules[state.activeUser] || masterSchedules.christos;
      const order = dayNum === 1 ? [0, 1, 2, 3] : [1, 0, 3, 2];
      const items = [];

      // Add regular classes & Lunch
      regularBellTimes.forEach(slot => {
        if (slot.type === "lunch") {
          const meta = subjectMeta["Lunch"];
          items.push({
            sortMinutes: slot.sortMinutes,
            html: `
              <div class="avec-card">
                <div class="class-row single-line">
                  <div class="emoji-circle" style="background-color: ${meta.bg};">${meta.emoji}</div>
                  <div class="class-body">
                    <div class="class-top-line">
                      <span class="class-name">Lunch</span>
                      <span class="class-time">${slot.time}</span>
                    </div>
                  </div>
                </div>
              </div>
            `
          });
        } else {
          const courseIdx = order[slot.periodIdx];
          const course = student.baseSchedule[courseIdx][state.activeSemester];
          const meta = subjectMeta[course.title] || { emoji: "📖", bg: "#E2E8F0" };
          const activeClassTasks = state.tasks.filter(
            t => !t.completed && t.classKey.toLowerCase() === course.title.toLowerCase()
          );

          const tasksHTML = activeClassTasks.length > 0
            ? `<div class="class-tasks-preview">
                ${activeClassTasks.map(t => `<div class="class-task-line">${escapeHTML(t.title)}${t.dueNote ? ` (${escapeHTML(t.dueNote)})` : ""}</div>`).join("")}
               </div>`
            : "";

          items.push({
            sortMinutes: slot.sortMinutes,
            html: `
              <div class="avec-card">
                <div class="class-row">
                  <div class="emoji-circle" style="background-color: ${meta.bg};">${meta.emoji}</div>
                  <div class="class-body">
                    <div class="class-top-line">
                      <span class="class-name">${escapeHTML(course.title)}</span>
                      <span class="class-time">${slot.time}</span>
                    </div>
                    <div class="class-meta">${escapeHTML(course.teacher)} | Room ${escapeHTML(course.room)}</div>
                    ${tasksHTML}
                  </div>
                </div>
              </div>
            `
          });
        }
      });

      // Inject matching standalone or repeating custom calendar events
      state.customEvents
        .filter(ev => {
          if (ev.repeatType === "date") {
            return ev.date === targetDateISO;
          }
          return ev.day === "all" || Number(ev.day) === dayNum;
        })
        .forEach(ev => {
          const scheduleLabel = getEventScheduleLabel(ev);
          const locationPart = ev.location ? `${escapeHTML(ev.location)} • ` : "";
          items.push({
            sortMinutes: parseTimeToMinutes(ev.time),
            html: `
              <div class="avec-card">
                <div class="class-row">
                  <div class="emoji-circle" style="background-color: #BAE6FD;">${escapeHTML(ev.emoji || "📅")}</div>
                  <div class="class-body">
                    <div class="class-top-line">
                      <span class="class-name">${escapeHTML(ev.title)}</span>
                      <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="class-time">${escapeHTML(ev.time)}</span>
                        <button type="button" class="delete-icon-btn" onclick="window.deleteCustomEvent(${ev.id})" title="Remove event" aria-label="Remove event">×</button>
                      </div>
                    </div>
                    <div class="class-meta">${locationPart}${escapeHTML(scheduleLabel)}</div>
                  </div>
                </div>
              </div>
            `
          });
        });

      items.sort((a, b) => a.sortMinutes - b.sortMinutes);
      return `<div class="card-stack">${items.map(i => i.html).join("")}</div>`;
    }

    /* ==========================================================================
       SEARCH & 7-DAY BROWSER RENDERER
       ========================================================================== */
    function renderSearchHTML() {
      const today = new Date();
      let stripHTML = "";
      for (let offset = 0; offset < 7; offset++) {
        const d = new Date(today);
        d.setDate(today.getDate() + offset);
        const dayLabel = offset === 0 ? "Today" : d.toLocaleDateString("en-US", { weekday: "short" });
        const dayNum = d.getDate();
        const cycleDay = ((state.currentDay - 1 + offset) % 2) + 1;
        stripHTML += `
          <div class="day-strip-item ${state.searchDayOffset === offset ? "active" : ""}" onclick="window.selectSearchDay(${offset})">
            <div class="day-strip-name">${dayLabel}</div>
            <div class="day-strip-num">${dayNum}</div>
            <div class="day-strip-badge">Day ${cycleDay}</div>
          </div>
        `;
      }

      return `
        <div class="avec-card" style="padding: 12px 16px; margin-bottom: 12px;">
          <input
            type="text"
            id="searchField"
            class="form-control"
            style="margin-bottom: 0;"
            placeholder="Search tasks, classes, teachers, rooms, events..."
            oninput="window.runSearchFilter()"
          />
        </div>
        <div class="day-strip">${stripHTML}</div>
        <div id="searchResultsContainer"></div>
      `;
    }

    function runSearchFilter() {
      const input = document.getElementById("searchField");
      const container = document.getElementById("searchResultsContainer");
      if (!container) return;

      const query = (input ? input.value : "").trim().toLowerCase();
      const previewDay = ((state.currentDay - 1 + state.searchDayOffset) % 2) + 1;
      const previewDate = new Date();
      previewDate.setDate(previewDate.getDate() + state.searchDayOffset);
      const previewDateISO = getLocalDateISO(previewDate);

      if (!query) {
        container.innerHTML = `
          <div class="section-header-row">
            <h3 class="section-title" style="font-size: 0.94rem; color: var(--text-muted);">
              Day ${previewDay} • ${formatFriendlyDate(previewDateISO)}
            </h3>
          </div>
          ${renderScheduleHTML(previewDay, previewDateISO)}
        `;
        return;
      }

      const student = masterSchedules[state.activeUser] || masterSchedules.christos;
      const matches = [];

      // Search Tasks
      state.tasks.forEach(t => {
        if (
          t.title.toLowerCase().includes(query) ||
          t.classKey.toLowerCase().includes(query) ||
          (t.dueNote || "").toLowerCase().includes(query)
        ) {
          matches.push({
            badge: `Task • ${t.classKey}`,
            title: t.title,
            sub: t.completed ? "Completed" : (t.dueNote || "Active Task")
          });
        }
      });

      // Search Classes
      student.baseSchedule.forEach((period, idx) => {
        ["s1", "s2"].forEach(sem => {
          const c = period[sem];
          if (
            c.title.toLowerCase().includes(query) ||
            c.teacher.toLowerCase().includes(query) ||
            c.room.toLowerCase().includes(query)
          ) {
            matches.push({
              badge: `Period ${idx + 1} (${sem.toUpperCase()})`,
              title: c.title,
              sub: `${c.teacher} | Room ${c.room}`
            });
          }
        });
      });

      // Search Custom Events
      state.customEvents.forEach(ev => {
        const schedLabel = getEventScheduleLabel(ev);
        if (
          ev.title.toLowerCase().includes(query) ||
          (ev.location || "").toLowerCase().includes(query) ||
          schedLabel.toLowerCase().includes(query)
        ) {
          matches.push({
            eventId: ev.id,
            badge: `Event • ${ev.time} (${schedLabel})`,
            title: ev.title,
            sub: ev.location || "Calendar Event"
          });
        }
      });

      if (matches.length === 0) {
        container.innerHTML = `
          <div class="avec-card" style="text-align: center; padding: 28px; color: var(--text-muted);">
            No matching tasks, classes, or events found.
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="card-stack">
          ${matches.map(m => `
            <div class="avec-card" style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
              <div style="min-width: 0; flex: 1;">
                <div class="task-item-tag" style="margin-top: 0; margin-bottom: 3px;">${escapeHTML(m.badge)}</div>
                <div class="class-name">${escapeHTML(m.title)}</div>
                <div class="class-meta" style="margin-top: 3px; margin-left: 0;">${escapeHTML(m.sub)}</div>
              </div>
              ${m.eventId ? `<button type="button" class="delete-icon-btn" onclick="window.deleteCustomEvent(${m.eventId})" title="Remove event">×</button>` : ""}
            </div>
          `).join("")}
        </div>
      `;
    }

    function render() {
      state.viewingDateISO = getLocalDateISO(new Date());
      updateChrome();
      const main = document.getElementById("mainContent");

      if (state.currentView === "schedule") {
        main.innerHTML = renderScheduleHTML(state.currentDay, state.viewingDateISO);
      } else if (state.currentView === "tasks") {
        main.innerHTML = renderTasksHTML();
      } else if (state.currentView === "search") {
        main.innerHTML = renderSearchHTML();
        runSearchFilter();
      }
    }

    /* ==========================================================================
       BOTTOM SHEET HELPERS
       ========================================================================== */
    function openSheet(innerHTML) {
      const sheet = document.getElementById("bottomSheet");
      const backdrop = document.getElementById("sheetBackdrop");
      sheet.innerHTML = `<div class="sheet-grabber"></div>${innerHTML}`;
      backdrop.classList.add("open");
      sheet.classList.add("open");
    }

    function closeSheet() {
      document.getElementById("sheetBackdrop").classList.remove("open");
      document.getElementById("bottomSheet").classList.remove("open");
    }

    /* ==========================================================================
       GLOBAL INTERACTION HANDLERS (Exposed on window for reliability)
       ========================================================================== */
    window.toggleDay = function () {
      state.currentDay = state.currentDay === 1 ? 2 : 1;
      render();
    };

    window.switchView = function (view) {
      state.currentView = view;
      closeSheet();
      render();
    };

    window.toggleTheme = function () {
      applyTheme(state.theme === "light" ? "dark" : "light");
    };

    window.toggleSemester = function () {
      state.activeSemester = state.activeSemester === "s1" ? "s2" : "s1";
      persistState();
      render();
    };

    window.setTaskFilter = function (cat) {
      state.taskFilter = cat;
      render();
    };

    window.toggleTask = function (id) {
      state.tasks = state.tasks.map(t => (t.id === id ? { ...t, completed: !t.completed } : t));
      persistState();
      render();
    };

    window.deleteTask = function (id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      persistState();
      render();
    };

    window.deleteCustomEvent = function (id, refreshManageSheet = false) {
      state.customEvents = state.customEvents.filter(ev => ev.id !== id);
      persistState();
      render();
      if (refreshManageSheet) {
        window.openManageEventsSheet();
      }
    };

    window.selectSearchDay = function (offset) {
      state.searchDayOffset = offset;
      render();
    };

    window.runSearchFilter = runSearchFilter;
    window.closeSheet = closeSheet;

    /* ==========================================================================
       MENU BAR SHEET
       ========================================================================== */
    window.openMenuSheet = function () {
      const student = masterSchedules[state.activeUser] || masterSchedules.christos;
      openSheet(`
        <div class="sheet-header">
          <h3 class="sheet-title">Menu Bar</h3>
          <button type="button" class="sheet-close" onclick="window.closeSheet()">×</button>
        </div>

        <button type="button" class="menu-row-btn" onclick="window.toggleTheme(); window.openMenuSheet();">
          <span>Appearance</span>
          <span style="color: var(--accent-blue);">${state.theme === "dark" ? "Dark Mode" : "Light Mode"}</span>
        </button>

        <button type="button" class="menu-row-btn" onclick="window.toggleSemester(); window.openMenuSheet();">
          <span>Semester</span>
          <span style="color: var(--accent-blue);">Semester ${state.activeSemester === "s1" ? "1" : "2"}</span>
        </button>

        <button type="button" class="menu-row-btn" onclick="window.openManageEventsSheet()">
          <span>Manage Calendar Events (${state.customEvents.length})</span>
          <span style="color: var(--text-muted);">›</span>
        </button>

        <button type="button" class="menu-row-btn" onclick="window.openCompareSheet()">
          <span>Compare Schedules</span>
          <span style="color: var(--text-muted);">›</span>
        </button>

        <button type="button" class="menu-row-btn" onclick="window.openProfileSheet()">
          <span>Switch Profile (${escapeHTML(student.name)})</span>
          <span style="color: var(--text-muted);">›</span>
        </button>
      `);
    };

    window.openManageEventsSheet = function () {
      const listHTML = state.customEvents.length === 0
        ? `<div style="text-align: center; padding: 26px 12px; color: var(--text-muted); font-size: 0.92rem;">
            No custom calendar events yet.
           </div>`
        : state.customEvents.map(ev => `
            <div class="avec-card" style="padding: 13px 15px; margin-bottom: 10px; background: var(--card-nested); display: flex; justify-content: space-between; align-items: center; gap: 10px;">
              <div style="display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1;">
                <div class="emoji-circle" style="background-color: #BAE6FD; margin-top: 0;">${escapeHTML(ev.emoji || "📅")}</div>
                <div style="min-width: 0; flex: 1;">
                  <div class="class-name" style="font-size: 0.96rem;">${escapeHTML(ev.title)}</div>
                  <div class="class-meta" style="margin-left: 0; font-size: 0.8rem;">
                    ${escapeHTML(ev.time)} • ${escapeHTML(getEventScheduleLabel(ev))}${ev.location ? ` • ${escapeHTML(ev.location)}` : ""}
                  </div>
                </div>
              </div>
              <button type="button" class="delete-icon-btn" onclick="window.deleteCustomEvent(${ev.id}, true)" title="Remove event">×</button>
            </div>
          `).join("");

      openSheet(`
        <div class="sheet-header">
          <h3 class="sheet-title">Calendar Events</h3>
          <button type="button" class="sheet-close" onclick="window.closeSheet()">×</button>
        </div>
        ${listHTML}
        <button type="button" class="primary-action-btn" style="margin-top: 6px;" onclick="window.openNewSheet('event')">
          + New Calendar Event
        </button>
      `);
    };

    /* ==========================================================================
       CREATE NEW MODAL (Task & Calendar Event)
       ========================================================================== */
    window.handleEventScheduleModeChange = function () {
      const modeEl = document.getElementById("eventScheduleMode");
      const dateWrapper = document.getElementById("specificDateWrapper");
      if (modeEl && dateWrapper) {
        dateWrapper.style.display = modeEl.value === "specific_date" ? "block" : "none";
      }
    };

    window.openNewSheet = function (mode = "task") {
      const student = masterSchedules[state.activeUser] || masterSchedules.christos;
      const todayISO = getLocalDateISO(new Date());
      const classOptions = Array.from(
        new Set(student.baseSchedule.map(p => p[state.activeSemester].title).concat(["General"]))
      )
        .map(subj => `<option value="${escapeHTML(subj)}">${escapeHTML(subj)}</option>`)
        .join("");

      const bodyHTML = mode === "task"
        ? `
          <label class="form-label" for="taskSubjectSelect">Class</label>
          <select id="taskSubjectSelect" class="form-control">${classOptions}</select>

          <label class="form-label" for="taskTitleInput">Task Description</label>
          <input type="text" id="taskTitleInput" class="form-control" placeholder="e.g., Periodic Table test on April 1st." />

          <label class="form-label" for="taskDueInput">Due Note (Optional)</label>
          <input type="text" id="taskDueInput" class="form-control" placeholder="e.g., Due tomorrow" />

          <button type="button" class="primary-action-btn" onclick="window.submitNewTask()">Save Task</button>
        `
        : `
          <div style="display: grid; grid-template-columns: 84px 1fr; gap: 10px;">
            <div>
              <label class="form-label" for="eventEmojiSelect">Icon</label>
              <select id="eventEmojiSelect" class="form-control">
                <option value="📅">📅</option>
                <option value="🎉">🎉</option>
                <option value="🏀">🏀</option>
                <option value="🎵">🎵</option>
                <option value="📝">📝</option>
                <option value="🩺">🩺</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="eventTitleInput">Event Title</label>
              <input type="text" id="eventTitleInput" class="form-control" placeholder="e.g., Robotics Club" />
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label class="form-label" for="eventTimeInput">Time</label>
              <input type="time" id="eventTimeInput" class="form-control" value="15:15" />
            </div>
            <div>
              <label class="form-label" for="eventScheduleMode">When</label>
              <select id="eventScheduleMode" class="form-control" onchange="window.handleEventScheduleModeChange()">
                <option value="today">Today Only</option>
                <option value="specific_date">Specific Date</option>
                <option value="day1">Repeats Day 1</option>
                <option value="day2">Repeats Day 2</option>
                <option value="all">Every Day</option>
              </select>
            </div>
          </div>

          <div id="specificDateWrapper" style="display: none;">
            <label class="form-label" for="eventDateInput">Select Date</label>
            <input type="date" id="eventDateInput" class="form-control" value="${todayISO}" />
          </div>

          <label class="form-label" for="eventLocationInput">Room / Notes (Optional)</label>
          <input type="text" id="eventLocationInput" class="form-control" placeholder="e.g., Room 119" />

          <button type="button" class="primary-action-btn" onclick="window.submitNewEvent()">Add to Schedule</button>
        `;

      openSheet(`
        <div class="sheet-header">
          <h3 class="sheet-title">${mode === "task" ? "New Task" : "New Calendar Event"}</h3>
          <button type="button" class="sheet-close" onclick="window.closeSheet()">×</button>
        </div>
        <div class="segmented-bar">
          <button type="button" class="segment-btn ${mode === "task" ? "active" : ""}" onclick="window.openNewSheet('task')">New Task</button>
          <button type="button" class="segment-btn ${mode === "event" ? "active" : ""}" onclick="window.openNewSheet('event')">Calendar Event</button>
        </div>
        ${bodyHTML}
      `);
    };

    window.submitNewTask = function () {
      const classKey = document.getElementById("taskSubjectSelect").value;
      const titleInput = document.getElementById("taskTitleInput");
      const dueInput = document.getElementById("taskDueInput");
      const title = titleInput ? titleInput.value.trim() : "";
      const dueNote = dueInput ? dueInput.value.trim() : "";
      if (!title) {
        if (titleInput) titleInput.focus();
        return;
      }

      state.tasks.unshift({
        id: Date.now(),
        classKey,
        title,
        dueNote,
        completed: false
      });
      persistState();
      closeSheet();
      render();
    };

    window.submitNewEvent = function () {
      const titleInput = document.getElementById("eventTitleInput");
      const title = titleInput ? titleInput.value.trim() : "";
      if (!title) {
        if (titleInput) titleInput.focus();
        return;
      }

      const emoji = document.getElementById("eventEmojiSelect").value || "📅";
      const rawTime = document.getElementById("eventTimeInput").value || "15:15";
      const time = format24To12(rawTime);
      const scheduleMode = document.getElementById("eventScheduleMode").value;
      const pickedDate = document.getElementById("eventDateInput") ? document.getElementById("eventDateInput").value : "";
      const location = document.getElementById("eventLocationInput").value.trim();

      const newEvent = {
        id: Date.now(),
        title,
        time,
        location,
        emoji
      };

      if (scheduleMode === "today") {
        newEvent.repeatType = "date";
        newEvent.date = getLocalDateISO(new Date());
      } else if (scheduleMode === "specific_date") {
        newEvent.repeatType = "date";
        newEvent.date = pickedDate || getLocalDateISO(new Date());
      } else if (scheduleMode === "day1") {
        newEvent.repeatType = "cycle";
        newEvent.day = 1;
      } else if (scheduleMode === "day2") {
        newEvent.repeatType = "cycle";
        newEvent.day = 2;
      } else {
        newEvent.repeatType = "cycle";
        newEvent.day = "all";
      }

      state.customEvents.push(newEvent);
      persistState();
      closeSheet();
      state.currentView = "schedule";
      render();
    };

    /* ==========================================================================
       PROFILE & COMPARE SCHEDULES SHEETS
       ========================================================================== */
    window.openProfileSheet = function () {
      const pillsHTML = Object.keys(masterSchedules).map(key => `
        <button type="button" class="profile-pill-btn ${state.activeUser === key ? "active" : ""}" onclick="window.selectProfile('${key}')">
          ${escapeHTML(masterSchedules[key].name)}
        </button>
      `).join("");

      openSheet(`
        <div class="sheet-header">
          <h3 class="sheet-title">Profile & Settings</h3>
          <button type="button" class="sheet-close" onclick="window.closeSheet()">×</button>
        </div>

        <label class="form-label">Active Student Profile</label>
        <div class="profile-grid">${pillsHTML}</div>

        <button type="button" class="menu-row-btn" onclick="window.toggleTheme(); window.openProfileSheet();">
          <span>Theme</span>
          <span style="color: var(--accent-blue);">${state.theme === "dark" ? "Dark Mode" : "Light Mode"}</span>
        </button>

        <button type="button" class="primary-action-btn" style="margin-top: 6px;" onclick="window.openCompareSheet()">
          Compare Schedules with Friends
        </button>
      `);
    };

    window.selectProfile = function (key) {
      state.activeUser = key;
      persistState();
      closeSheet();
      render();
    };

    window.openCompareSheet = function () {
      const friendPills = Object.keys(masterSchedules).map(key => {
        const selected = state.selectedFriends.includes(key);
        return `
          <button type="button" class="profile-pill-btn ${selected ? "active" : ""}" onclick="window.toggleCompareFriend('${key}')">
            ${escapeHTML(masterSchedules[key].name)}
          </button>
        `;
      }).join("");

      let periodsHTML = "";
      for (let p = 0; p < 4; p++) {
        const subjectCounts = {};
        state.selectedFriends.forEach(k => {
          const s = masterSchedules[k];
          if (s) {
            const title = s.baseSchedule[p][state.compareSemester].title;
            subjectCounts[title] = (subjectCounts[title] || 0) + 1;
          }
        });

        const hasMatch = Object.values(subjectCounts).some(count => count > 1);
        const rows = state.selectedFriends.map(k => {
          const s = masterSchedules[k];
          if (!s) return "";
          const course = s.baseSchedule[p][state.compareSemester];
          const isMatch = subjectCounts[course.title] > 1;
          return `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 10px; background: ${isMatch ? "var(--match-bg)" : "transparent"}; font-size: 0.86rem;">
              <span style="font-weight: 600; width: 88px;">${escapeHTML(s.name)}</span>
              <span style="flex: 1; text-align: center; font-weight: ${isMatch ? "700" : "500"}; color: ${isMatch ? "var(--match-text)" : "var(--text-primary)"};">${escapeHTML(course.title)}</span>
              <span style="color: var(--text-muted); font-size: 0.78rem;">Rm ${escapeHTML(course.room)}</span>
            </div>
          `;
        }).join("");

        periodsHTML += `
          <div class="avec-card" style="padding: 14px 16px; margin-bottom: 10px; background: var(--card-nested);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted);">
              <span>Period ${p + 1}</span>
              ${hasMatch ? `<span style="color: var(--accent-green);">Shared Class</span>` : ""}
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px;">${rows}</div>
          </div>
        `;
      }

      openSheet(`
        <div class="sheet-header">
          <h3 class="sheet-title">Compare Schedules</h3>
          <button type="button" class="sheet-close" onclick="window.closeSheet()">×</button>
        </div>

        <div class="segmented-bar">
          <button type="button" class="segment-btn ${state.compareSemester === "s1" ? "active" : ""}" onclick="window.setCompareSem('s1')">Semester 1</button>
          <button type="button" class="segment-btn ${state.compareSemester === "s2" ? "active" : ""}" onclick="window.setCompareSem('s2')">Semester 2</button>
        </div>

        <label class="form-label">Select Students</label>
        <div class="profile-grid">${friendPills}</div>
        ${periodsHTML}
      `);
    };

    window.setCompareSem = function (sem) {
      state.compareSemester = sem;
      window.openCompareSheet();
    };

    window.toggleCompareFriend = function (key) {
      if (state.selectedFriends.includes(key)) {
        if (state.selectedFriends.length > 1) {
          state.selectedFriends = state.selectedFriends.filter(k => k !== key);
        }
      } else {
        state.selectedFriends.push(key);
      }
      window.openCompareSheet();
    };

    /* ==========================================================================
       INITIALIZE APP
       ========================================================================== */
    applyTheme(state.theme);
    render();
  })();
</script>
</body>
</html>
