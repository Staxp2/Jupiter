<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jupiter — Student Hub</title>
  <style>
    :root {
      --bg-black: #000000;
      --text-white: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: 1px solid rgba(255, 255, 255, 0.12);
      --glass-blur: blur(20px) saturate(180%);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-black);
      color: var(--text-white);
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 480px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0; }
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--glass-shadow);
      margin-bottom: 16px;
    }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
    select {
      width: 100%; padding: 14px 16px; border-radius: 12px; border: var(--glass-border);
      background: #111827; color: var(--text-white); font-size: 1rem; outline: none; cursor: pointer; margin-bottom: 16px; box-sizing: border-box;
    }
    .primary-btn {
      width: 100%; padding: 14px; background: #ffffff; color: #000000; border: none;
      border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .switch-btn { background: transparent; border: var(--glass-border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
    .day-toggle { display: flex; gap: 8px; }
    .day-btn {
      flex: 1; padding: 10px; background: rgba(255, 255, 255, 0.04); border: var(--glass-border);
      border-radius: 10px; color: var(--text-muted); font-weight: 600; cursor: pointer;
    }
    .day-btn.active { background: #ffffff; color: #000000; border-color: #ffffff; }
    .schedule-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; border-bottom: var(--glass-border); padding-bottom: 12px; }
    .schedule-header h2 { font-size: 1.25rem; margin: 0; font-weight: 500; }
    .period-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    .period-row:last-child { border-bottom: none; }
    .period-time { font-size: 0.8rem; color: var(--text-muted); }
    .period-subject { font-weight: 500; font-size: 1.05rem; margin-top: 2px; }
    .period-meta { font-size: 0.85rem; color: var(--text-muted); text-align: right; }
    .room-badge { background: rgba(255, 255, 255, 0.1); padding: 2px 8px; border-radius: 6px; color: #ffffff; font-weight: 500; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Jupiter</h1>
    <button id="switchBtn" class="switch-btn" onclick="showOnboarding()" style="display: none;">Switch Profile</button>
  </header>

  <!-- Onboarding Screen -->
  <div id="onboardingCard" class="glass-card">
    <h2 style="margin-top: 0; font-size: 1.4rem; font-weight: 600;">Welcome to Jupiter</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Select your name to load your schedule.</p>
    <label for="studentSelect">Who are you?</label>
    <select id="studentSelect">
      <option value="christos">Christos</option>
      <option value="christopher">Christopher</option>
      <option value="imraan">Imraan</option>
      <option value="mahrus">Mahrus</option>
      <option value="caleb">Caleb</option>
    </select>
    <button class="primary-btn" onclick="saveProfileAndStart()">Get Started</button>
  </div>

  <!-- Schedule Screen -->
  <div id="scheduleApp" style="display: none;">
    <div class="glass-card" style="padding: 16px 24px;">
      <label style="margin-bottom: 8px;">Rotation Day (Auto-detected)</label>
      <div class="day-toggle">
        <button id="btnDay1" class="day-btn" onclick="setDay(1)">Day 1</button>
        <button id="btnDay2" class="day-btn" onclick="setDay(2)">Day 2</button>
      </div>
    </div>
    <div class="glass-card">
      <div class="schedule-header">
        <h2 id="displayName">Schedule</h2>
        <span class="period-time" id="dayIndicator">Day 1</span>
      </div>
      <div id="scheduleContainer"></div>
    </div>
  </div>
</div>

<script>
  let currentDay = 1;
  let activeUser = localStorage.getItem('jupiter_user_profile');

  const masterSchedules = {
    "christos": {
      name: "Christos",
      baseSchedule: [
        { period: 1, time: "9:00 AM - 10:20 AM", title: "Science", room: "318", teacher: "Ding, Xiao Yue" },
        { period: 2, time: "10:25 AM - 11:40 AM", title: "Exploring Canadian Geography", room: "214", teacher: "Domingues, Lucia" },
        { period: 3, time: "12:40 PM - 1:55 PM", title: "Mathematics", room: "307", teacher: "Scharlach, Alf" },
        { period: 4, time: "2:00 PM - 3:15 PM", title: "Dramatic Arts", room: "200", teacher: "Ugarkovic, Sonya" }
      ]
    },
    "christopher": {
      name: "Christopher",
      baseSchedule: [
        { period: 1, time: "9:00 AM - 10:20 AM", title: "Class 1", room: "101", teacher: "Staff" },
        { period: 2, time: "10:25 AM - 11:40 AM", title: "Class 2", room: "102", teacher: "Staff" },
        { period: 3, time: "12:40 PM - 1:55 PM", title: "Class 3", room: "103", teacher: "Staff" },
        { period: 4, time: "2:00 PM - 3:15 PM", title: "Class 4", room: "104", teacher: "Staff" }
      ]
    },
    "imraan": {
      name: "Imraan",
      baseSchedule: [
        { period: 1, time: "9:00 AM - 10:20 AM", title: "Class 1", room: "201", teacher: "Staff" },
        { period: 2, time: "10:25 AM - 11:40 AM", title: "Class 2", room: "202", teacher: "Staff" },
        { period: 3, time: "12:40 PM - 1:55 PM", title: "Class 3", room: "203", teacher: "Staff" },
        { period: 4, time: "2:00 PM - 3:15 PM", title: "Class 4", room: "204", teacher: "Staff" }
      ]
    },
    "mahrus": {
      name: "Mahrus",
      baseSchedule: [
        { period: 1, time: "9:00 AM - 10:20 AM", title: "Class 1", room: "301", teacher: "Staff" },
        { period: 2, time: "10:25 AM - 11:40 AM", title: "Class 2", room: "302", teacher: "Staff" },
        { period: 3, time: "12:40 PM - 1:55 PM", title: "Class 3", room: "303", teacher: "Staff" },
        { period: 4, time: "2:00 PM - 3:15 PM", title: "Class 4", room: "304", teacher: "Staff" }
      ]
    },
    "caleb": {
      name: "Caleb",
      baseSchedule: [
        { period: 1, time: "9:00 AM - 10:20 AM", title: "Class 1", room: "401", teacher: "Staff" },
        { period: 2, time: "10:25 AM - 11:40 AM", title: "Class 2", room: "402", teacher: "Staff" },
        { period: 3, time: "12:40 PM - 1:55 PM", title: "Class 3", room: "403", teacher: "Staff" },
        { period: 4, time: "2:00 PM - 3:15 PM", title: "Class 4", room: "404", teacher: "Staff" }
      ]
    }
  };

  function autoDetectDay() {
    const today = new Date();
    const dayOfMonth = today.getDate();
    return (dayOfMonth % 2 !== 0) ? 1 : 2;
  }

  function init() {
    currentDay = autoDetectDay();
    if (activeUser && masterSchedules[activeUser]) {
      showSchedule();
    } else {
      showOnboarding();
    }
  }

  function showOnboarding() {
    document.getElementById('onboardingCard').style.display = 'block';
    document.getElementById('scheduleApp').style.display = 'none';
    document.getElementById('switchBtn').style.display = 'none';
  }

  function saveProfileAndStart() {
    const selectEl = document.getElementById('studentSelect');
    activeUser = selectEl.value;
    localStorage.setItem('jupiter_user_profile', activeUser);
    showSchedule();
  }

  function showSchedule() {
    document.getElementById('onboardingCard').style.display = 'none';
    document.getElementById('scheduleApp').style.display = 'block';
    document.getElementById('switchBtn').style.display = 'block';
    document.getElementById('btnDay1').classList.toggle('active', currentDay === 1);
    document.getElementById('btnDay2').classList.toggle('active', currentDay === 2);
    document.getElementById('dayIndicator').textContent = `Day ${currentDay}`;
    renderSchedule();
  }

  function setDay(day) {
    currentDay = day;
    document.getElementById('btnDay1').classList.toggle('active', day === 1);
    document.getElementById('btnDay2').classList.toggle('active', day === 2);
    document.getElementById('dayIndicator').textContent = `Day ${currentDay}`;
    renderSchedule();
  }

  function renderSchedule() {
    const student = masterSchedules[activeUser];
    if (!student) return;
    document.getElementById('displayName').textContent = `${student.name}'s Schedule`;
    const container = document.getElementById('scheduleContainer');
    container.innerHTML = '';

    const base = student.baseSchedule;
    let activeSchedule = (currentDay === 1) ? [
      { slot: "Period 1", time: base[0].time, data: base[0] },
      { slot: "Period 2", time: base[1].time, data: base[1] },
      { slot: "Period 3", time: base[2].time, data: base[2] },
      { slot: "Period 4", time: base[3].time, data: base[3] }
    ] : [
      { slot: "Period 1", time: base[0].time, data: base[1] },
      { slot: "Period 2", time: base[1].time, data: base[0] },
      { slot: "Period 3", time: base[2].time, data: base[3] },
      { slot: "Period 4", time: base[3].time, data: base[2] }
    ];

    activeSchedule.forEach(item => {
      const row = document.createElement('div');
      row.className = 'period-row';
      row.innerHTML = `
        <div>
          <div class="period-time">${item.slot} • ${item.time}</div>
          <div class="period-subject">${item.data.title}</div>
        </div>
        <div class="period-meta">
          <span class="room-badge">Rm ${item.data.room}</span>
          <div style="margin-top: 4px; font-size: 0.75rem;">${item.data.teacher}</div>
        </div>
      `;
      container.appendChild(row);
    });
  }

  window.onload = init;
</script>
</body>
</html>
<link rel="icon" type="image/png" href="./liquid-glass-logo-1x1-2160x2160-0.90s.png">
